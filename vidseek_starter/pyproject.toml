[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vidseek-embeddinggemma"
version = "0.1.0"
description = "Local semantic video search for AI agents, powered by EmbeddingGemma 2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VidSeek contributors" }]
keywords = ["video", "embeddings", "semantic-search", "ai-agents", "embeddinggemma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "sentence-transformers>=5.1.0",
  "transformers>=4.57.0",
  "torchcodec>=0.7.0",
  "pillow>=10.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/vidseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
